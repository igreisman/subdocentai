<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Videos</title>
  <link rel="stylesheet" href="/web/site-header.css">
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f4f7fb;
      color: #1d2734;
      min-height: 100vh;
    }

    main {
      max-width: 820px;
      margin: 0 auto;
      padding: 24px 20px 64px;
    }

    .video-group {
      margin-bottom: 36px;
    }

    .video-group-title {
      margin: 0 0 14px;
      padding-bottom: 8px;
      border-bottom: 2px solid #dbe3ee;
      font-size: 15px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #44506a;
    }

    .video-card {
      background: #fff;
      border: 1px solid #e1e7ef;
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 28px;
      box-shadow: 0 1px 2px rgba(20, 35, 60, 0.05);
    }

    .video-frame {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      display: block;
    }

    .video-frame iframe,
    .video-frame video {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }

    .video-body {
      padding: 16px 18px 18px;
    }

    .video-title {
      margin: 0 0 8px;
      font-size: 18px;
      line-height: 1.3;
      color: #14213d;
    }

    .video-description {
      margin: 0;
      font-size: 15px;
      line-height: 1.6;
      color: #33415c;
      white-space: pre-wrap;
    }

    .video-meta {
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid #eef2f7;
      font-size: 12px;
      line-height: 1.5;
      color: #6a737d;
    }

    .video-meta a {
      color: #3d6fa5;
    }

    .video-rights {
      margin-top: 3px;
      font-style: italic;
    }

    .state {
      background: #fff;
      border: 1px solid #e1e7ef;
      border-radius: 10px;
      padding: 32px 24px;
      text-align: center;
      color: #55637a;
      font-size: 15px;
      line-height: 1.6;
    }

    .state strong {
      display: block;
      margin-bottom: 6px;
      color: #1d2734;
      font-size: 16px;
    }
  </style>
</head>

<body>
  <main>
    <div id="video-list">
      <div class="state">Loading&hellip;</div>
    </div>
  </main>

  <script src="/web/site-header.js"></script>
  <script>
    SiteHeader.render({
      title: 'Videos',
      subtitle: 'Film and firsthand accounts of the WWII submarine war, shown here with permission of the people who made them.',
      feedback: 'Know of a video we should include, or hold the rights to one you\'d like to share?',
    });

    const esc = s => String(s ?? '')
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');

    const list = document.getElementById('video-list');

    // Only http(s) reaches an iframe src. Records are hand-maintained in
    // videos.jsonl, and a malformed or hostile URL should render nothing
    // rather than become an embed.
    const isSafeUrl = u => /^https?:\/\//i.test(String(u || ''));

    function cardHtml(v) {
      const video = v.video || {};
      if (!isSafeUrl(video.embed_url)) return '';

      const title = v.title
        ? `<h2 class="video-title">${esc(v.title)}</h2>`
        : '';
      const description = v.description
        ? `<p class="video-description">${esc(v.description)}</p>`
        : '';

      const creditInner = video.credit_url && isSafeUrl(video.credit_url)
        ? `Courtesy of <a href="${esc(video.credit_url)}" target="_blank" rel="noopener noreferrer">${esc(video.credit)}</a>`
        : (video.credit ? `Courtesy of ${esc(video.credit)}` : '');
      const rights = v.rights_note
        ? `<div class="video-rights">${esc(v.rights_note)}</div>`
        : '';
      const meta = (creditInner || rights)
        ? `<div class="video-meta">${creditInner}${rights}</div>`
        : '';

      // A file we host plays in <video>; anything else is framed. preload
      // "metadata" fetches the header for duration and the poster frame without
      // pulling the whole file down before a visitor has asked to watch.
      const player = video.kind === 'file'
        ? `<video src="${esc(video.embed_url)}"
                  controls preload="metadata" playsinline
                  title="${esc(v.title || 'Video')}"></video>`
        : `<iframe src="${esc(video.embed_url)}"
                   title="${esc(v.title || 'Video')}"
                   loading="lazy"
                   allow="encrypted-media; picture-in-picture; fullscreen"
                   referrerpolicy="strict-origin-when-cross-origin"
                   allowfullscreen></iframe>`;

      return `
        <article class="video-card">
          <div class="video-frame">${player}</div>
          <div class="video-body">
            ${title}${description}${meta}
          </div>
        </article>`;
    }

    fetch('/api/videos')
      .then(r => {
        if (!r.ok) throw new Error('Server returned ' + r.status);
        return r.json();
      })
      .then(groups => {
        const sections = (groups || []).map(g => {
          const cards = (g.videos || []).map(cardHtml).filter(Boolean).join('');
          // A category whose videos all failed to render would otherwise leave a
          // heading standing over nothing.
          if (!cards) return '';
          return `<section class="video-group">
                    <h2 class="video-group-title">${esc(g.category)}</h2>
                    ${cards}
                  </section>`;
        }).filter(Boolean).join('');

        list.innerHTML = sections || `
          <div class="state">
            <strong>No videos yet</strong>
            We only publish video we have the rights to show. As permissions come
            through, the videos will appear here.
          </div>`;
      })
      .catch(err => {
        list.innerHTML = `<div class="state"><strong>Unable to load videos</strong>${esc(err.message)}</div>`;
      });
  </script>
</body>

</html>
