<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Submarine Museums</title>
  <link rel="stylesheet" href="/web/site-header.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0d1117;
      color: #e6edf3;
    }

    main {
      max-width: 860px;
      margin: 0 auto;
      padding: 40px 24px 56px;
    }

    .museum-card {
      display: flex;
      align-items: flex-start;
      padding: 24px;
      border: 1px solid #30363d;
      border-radius: 16px;
      background: linear-gradient(180deg, rgba(255,255,255,0.04), rgba(255,255,255,0.02));
      margin-bottom: 18px;
      text-decoration: none;
      color: inherit;
      transition: border-color 0.15s, transform 0.15s;
    }

    .museum-card:hover {
      border-color: #58a6ff;
      transform: translateY(-1px);
    }

    .museum-body { flex: 1; min-width: 0; }

    .museum-body h2 { margin: 0 0 4px; font-size: 20px; }

    .museum-body .designation {
      font-size: 13px;
      color: #8b949e;
      margin-bottom: 10px;
    }

    .museum-body p {
      margin: 0;
      font-size: 14px;
      color: #c9d1d9;
      line-height: 1.6;
    }
  </style>
</head>

<body>
  <main id="main">
  </main>

  <script src="/web/site-footer.js"></script>
  <script src="/web/site-header.js"></script>
  <script>
    SiteFooter.render();
    SiteHeader.render({
      title:    'Submarine Museums',
      subtitle: 'Preserved submarines and maritime museums open to the public, where you can step aboard and experience history firsthand.',
      feedback: 'Know of a submarine museum we should add? Have a correction?',
    });

    function escHtml(s) {
      return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    fetch('/api/museums')
      .then(r => r.json())
      .then(museums => {
        const main = document.getElementById('main');
        if (!museums.length) {
          main.innerHTML = '<p style="color:#8b949e;padding:24px 0">No museums listed yet.</p>';
          return;
        }
        main.innerHTML = museums.map(m => {
          const tag = m.url ? 'a' : 'div';
          const href = m.url ? ` href="${escHtml(m.url)}"` : '';
          return `<${tag} class="museum-card"${href}>
            <div class="museum-body">
              <h2>${escHtml(m.name)}</h2>
              ${m.designation ? `<div class="designation">${escHtml(m.designation)}</div>` : ''}
              ${m.location    ? `<div class="designation">${escHtml(m.location)}</div>` : ''}
              ${m.description ? `<p>${escHtml(m.description)}</p>` : ''}
            </div>
          </${tag}>`;
        }).join('');
      })
      .catch(e => {
        document.getElementById('main').innerHTML = '<p style="color:#8b949e;padding:24px 0">Unable to load museums.</p>';
      });
  </script>
</body>

</html>
