services:
  - type: web
    name: submarinedocent-demo
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: LEGACY_DOMAIN_HOSTS
        sync: false # optional: comma-separated hosts to redirect
      - key: LEGACY_DOMAIN_TARGET
        sync: false # optional: redirect target for legacy hosts
      - key: TOUR_HOST_PREFIXES
        sync: false # optional: comma-separated host prefixes that should land on the tour page
      - key: DEFAULT_ROOT_REDIRECT
        sync: false # optional: default page for first-time visitors
      - key: RETURNING_VISITOR_REDIRECT
        sync: false # optional: page for returning visitors with the visited cookie
      - key: SAMPLE_CONTENT_MODE
        sync: false # optional: serve the bundled sample corpus instead of the full content set
      - key: CONTENT_ROOT
        sync: false # optional: override the corpus directory path
      - key: GROQ_API_KEY
        sync: false # set manually in Render dashboard
      - key: OPENAI_API_KEY
        sync: false # set manually in Render dashboard
      - key: SMTP_USER
        sync: false # set manually in Render dashboard
      - key: SMTP_PASS
        sync: false # set manually in Render dashboard
      - key: ADMIN_USERNAME
        sync: false # required to enable admin and feedback-list routes
      - key: ADMIN_PASSWORD
        sync: false # required to enable admin and feedback-list routes
      - key: PREVIEW_USERNAME
        sync: false # optional: enable preview auth for the tour page
      - key: PREVIEW_PASSWORD
        sync: false # optional: enable preview auth for the tour page
